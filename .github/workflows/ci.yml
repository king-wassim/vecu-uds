name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build + unit tests + integration
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
                                   can-utils iproute2 kmod \
                                   python3-pip python3-venv

      # --- Stage 1: C build + ctest -----------------------------------
      - name: Configure (Debug)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

      # --- Stage 2: try to load CAN modules + run pytest --------------
      # GitHub-hosted runners use a slim kernel that may not ship vcan
      # or can-isotp. We try, and if either is missing we skip pytest
      # gracefully (with a warning) instead of failing the whole job.
      - name: Try loading CAN kernel modules
        id: canmods
        continue-on-error: true
        run: |
          sudo modprobe vcan
          sudo modprobe can-isotp
          lsmod | grep -E 'can|vcan'

      - name: Bring up vcan0
        if: steps.canmods.outcome == 'success'
        run: |
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0

      - name: Set up Python venv + install client deps
        if: steps.canmods.outcome == 'success'
        run: |
          cd client
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest

      - name: Run pytest integration suite
        if: steps.canmods.outcome == 'success'
        run: |
          cd client
          .venv/bin/pytest tests/ -v

      - name: Warn if integration tests skipped
        if: steps.canmods.outcome != 'success'
        run: echo "::warning::Kernel can-isotp not available on this runner — pytest integration suite skipped."
